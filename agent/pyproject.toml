[project]
name = "rackmind-agent"
version = "0.1.0"
description = "Rackmind agent: sends one real machine's metrics to the Rackmind API."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-psutil>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One file on purpose: easy to copy to a server and read before running it there.
only-include = ["rackmind_agent.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["rackmind_agent.py", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
