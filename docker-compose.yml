# Local development stack. Run with: docker compose up --build
# Values like ${POSTGRES_USER} are read from the `.env` file next to this file.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    # On every start: apply migrations, seed demo data (skipped if already present),
    # then run the server with --reload so code changes restart it automatically.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    # `&api-env` names this block so the worker can reuse it below with `*api-env`.
    environment: &api-env
      ENVIRONMENT: development
      # Inside the Compose network, services reach each other by service name (`db`, `redis`).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SEED_PASSWORD: ${SEED_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INGEST_API_KEY: ${INGEST_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      # Mount the source code so edits on your machine are seen by the container (hot reload).
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl, so use Python's standard library to call /health.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    # Same image and code as the API, but runs the ARQ worker instead of the web server.
    # --watch restarts the worker when files under app/ change (like uvicorn's --reload).
    build: ./api
    command: >
      arq app.workers.main.WorkerSettings --watch app
      --custom-log-dict app.workers.main.LOG_CONFIG
    environment: *api-env
    volumes:
      - ./api:/app
    depends_on:
      # Wait for the API, so migrations have run before the worker touches the DB.
      api:
        condition: service_healthy

  simulator:
    build: ./simulator
    environment:
      SIM_API_URL: http://api:8000
      SIM_API_KEY: ${INGEST_API_KEY}
      SIM_INTERVAL_S: 5
      # Fault schedule, e.g. "overheat:R02:60:600,memory_leak:r03-srv02:30:900". Empty = all normal.
      SIM_FAULTS: ${SIM_FAULTS:-}
    volumes:
      # Code is mounted like the API's; after editing, run `docker compose restart simulator`.
      - ./simulator:/app
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./web
    environment:
      # Used by next.config.ts: the Next.js server proxies /api/* to FastAPI on this address.
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      # Keep the container's own node_modules and build cache: the Windows host's copies
      # contain Windows-only native binaries that would not run in this Linux container.
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
